<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Show Your Work Calculator</title>
   <meta name="description" content="A scientific calculator that explains every step of its answer, graphs functions and converts units and currencies, powered by a hand-written expression parser instead of eval().">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
   <script>
      // Apply the saved (or system) theme before the page paints to avoid a flash.
      (function () {
         let theme = null;
         try {
            theme = localStorage.getItem('calc-theme');
         } catch (error) {}
         if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
         }
         document.documentElement.dataset.theme = theme;
      })();
   </script>
   <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="mediaqueries.css">
</head>
<body data-view="calc">

   <div class="container">
      <main class="calculator-layout">
         <section class="calculator" aria-label="Calculator">
            <div class="toolbar">
               <div class="mode-tabs" role="tablist" aria-label="Mode">
                  <button type="button" role="tab" id="tab-calc" class="mode-tab" data-view="calc" aria-controls="view-calc" aria-selected="true">Calculate</button>
                  <button type="button" role="tab" id="tab-graph" class="mode-tab" data-view="graph" aria-controls="view-graph" aria-selected="false" tabindex="-1">Graph</button>
                  <button type="button" role="tab" id="tab-convert" class="mode-tab" data-view="convert" aria-controls="view-convert" aria-selected="false" tabindex="-1">Convert</button>
               </div>
               <button type="button" id="theme-toggle" class="toolbar-button icon-button" aria-label="Switch to light theme">
                  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                     <circle cx="12" cy="12" r="4.5"></circle>
                     <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path>
                  </svg>
                  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                     <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path>
                  </svg>
               </button>
            </div>

            <!-- Calculator -->
            <div id="view-calc" class="view" role="tabpanel" aria-labelledby="tab-calc">
               <div class="view-options">
                  <button type="button" id="work-toggle" class="chip" aria-pressed="true" aria-controls="work-panel">Show work</button>
                  <button type="button" id="scientific-toggle" class="chip" aria-pressed="false" aria-controls="scientific-panel">Scientific</button>
                  <button type="button" id="angle-toggle" class="chip angle-chip">DEG</button>
               </div>

               <form id="calculator-form" onsubmit="return false;">
                  <div class="display">
                     <label for="display" class="visually-hidden">Expression</label>
                     <input type="text" name="display" id="display" class="display-input" readonly>
                     <output id="display-preview" class="display-preview" for="display" aria-hidden="true"></output>
                  </div>

                  <div id="scientific-panel" class="scientific-panel" role="group" aria-label="Scientific functions">
                     <div class="scientific-inner">
                        <div>
                           <input type="button" class="calc-button sci" value="sin" data-value="sin(" aria-label="Sine">
                           <input type="button" class="calc-button sci" value="cos" data-value="cos(" aria-label="Cosine">
                           <input type="button" class="calc-button sci" value="tan" data-value="tan(" aria-label="Tangent">
                           <input type="button" class="calc-button sci" value="ln" data-value="ln(" aria-label="Natural logarithm">
                        </div>
                        <div>
                           <input type="button" class="calc-button sci" value="sin⁻¹" data-value="asin(" aria-label="Inverse sine">
                           <input type="button" class="calc-button sci" value="cos⁻¹" data-value="acos(" aria-label="Inverse cosine">
                           <input type="button" class="calc-button sci" value="tan⁻¹" data-value="atan(" aria-label="Inverse tangent">
                           <input type="button" class="calc-button sci" value="log" data-value="log(" aria-label="Logarithm base 10">
                        </div>
                        <div>
                           <input type="button" class="calc-button sci" value="x²" data-value="^2" aria-label="Square">
                           <input type="button" class="calc-button sci" value="x⁻¹" data-value="^(-1)" aria-label="Reciprocal">
                           <input type="button" class="calc-button sci" value="x!" data-value="!" aria-label="Factorial">
                           <input type="button" class="calc-button sci" value="e" data-value="e" aria-label="Euler's number">
                        </div>
                     </div>
                  </div>

                  <div class="keypad">
                     <div>
                        <input type="button" class="calc-button operator" value="AC" data-action="clear" aria-label="Clear all">
                        <input type="button" class="calc-button operator" value="DE" data-action="delete" aria-label="Delete last character">
                        <input type="button" class="calc-button operator" value="(" data-value="(" aria-label="Open parenthesis">
                        <input type="button" class="calc-button operator" value=")" data-value=")" aria-label="Close parenthesis">
                     </div>
                     <div>
                        <input type="button" class="calc-button operator" value="√" data-action="sqrt" aria-label="Square root">
                        <input type="button" class="calc-button operator" value="^" data-value="^" aria-label="Power">
                        <input type="button" class="calc-button operator" value="%" data-value="%" aria-label="Percent">
                        <input type="button" class="calc-button operator" value="÷" data-value="/" aria-label="Divide">
                     </div>
                     <div>
                        <input type="button" class="calc-button" value="7" data-value="7">
                        <input type="button" class="calc-button" value="8" data-value="8">
                        <input type="button" class="calc-button" value="9" data-value="9">
                        <input type="button" class="calc-button operator" value="×" data-value="*" aria-label="Multiply">
                     </div>
                     <div>
                        <input type="button" class="calc-button" value="4" data-value="4">
                        <input type="button" class="calc-button" value="5" data-value="5">
                        <input type="button" class="calc-button" value="6" data-value="6">
                        <input type="button" class="calc-button operator" value="−" data-value="-" aria-label="Subtract">
                     </div>
                     <div>
                        <input type="button" class="calc-button" value="1" data-value="1">
                        <input type="button" class="calc-button" value="2" data-value="2">
                        <input type="button" class="calc-button" value="3" data-value="3">
                        <input type="button" class="calc-button operator" value="+" data-value="+" aria-label="Add">
                     </div>
                     <div>
                        <input type="button" class="calc-button operator" value="π" data-value="π" aria-label="Pi">
                        <input type="button" class="calc-button" value="0" data-value="0">
                        <input type="button" class="calc-button operator" value="." data-value="." aria-label="Decimal point">
                        <input type="button" class="calc-button equals" value="=" data-action="evaluate" aria-label="Equals">
                     </div>
                  </div>
               </form>
            </div>

            <!-- Graph -->
            <div id="view-graph" class="view graph-view" role="tabpanel" aria-labelledby="tab-graph" hidden>
               <div class="graph-input-row">
                  <label for="graph-input" class="graph-label">y =</label>
                  <input type="text" id="graph-input" class="text-input graph-input" value="sin(x) * x" spellcheck="false" autocomplete="off" autocapitalize="off">
               </div>
               <div class="graph-inserts" aria-label="Insert into function">
                  <button type="button" class="chip" data-graph-insert="x">x</button>
                  <button type="button" class="chip" data-graph-insert="^2" aria-label="Square">x²</button>
                  <button type="button" class="chip" data-graph-insert="sin(" aria-label="Sine">sin</button>
                  <button type="button" class="chip" data-graph-insert="cos(" aria-label="Cosine">cos</button>
                  <button type="button" class="chip" data-graph-insert="tan(" aria-label="Tangent">tan</button>
                  <button type="button" class="chip" data-graph-insert="√(" aria-label="Square root">√</button>
                  <button type="button" class="chip" data-graph-insert="ln(" aria-label="Natural logarithm">ln</button>
                  <button type="button" class="chip" data-graph-insert="π" aria-label="Pi">π</button>
               </div>
               <div class="graph-canvas-wrap">
                  <canvas id="graph-canvas" class="graph-canvas" role="img" aria-label="Graph"></canvas>
                  <div id="graph-readout" class="graph-readout" hidden></div>
                  <div class="graph-controls">
                     <button type="button" id="graph-zoom-in" class="toolbar-button icon-button" aria-label="Zoom in">+</button>
                     <button type="button" id="graph-zoom-out" class="toolbar-button icon-button" aria-label="Zoom out">−</button>
                     <button type="button" id="graph-reset" class="toolbar-button icon-button" aria-label="Reset view">⟲</button>
                  </div>
               </div>
               <p id="graph-status" class="view-status" aria-live="polite"></p>
            </div>

            <!-- Converter -->
            <div id="view-convert" class="view convert-view" role="tabpanel" aria-labelledby="tab-convert" hidden>
               <div id="convert-categories" class="convert-categories" role="group" aria-label="What to convert"></div>

               <label for="convert-amount" class="field-label">Amount</label>
               <input type="text" id="convert-amount" class="text-input convert-amount" value="1" inputmode="decimal" spellcheck="false" autocomplete="off">

               <div class="convert-units">
                  <div class="convert-unit">
                     <label for="convert-from" class="field-label">From</label>
                     <select id="convert-from" class="select-input"></select>
                  </div>
                  <button type="button" id="convert-swap" class="toolbar-button icon-button convert-swap" aria-label="Swap units">⇄</button>
                  <div class="convert-unit">
                     <label for="convert-to" class="field-label">To</label>
                     <select id="convert-to" class="select-input"></select>
                  </div>
               </div>

               <output id="convert-result" class="convert-result" for="convert-amount convert-from convert-to" aria-live="polite">—</output>
               <p id="convert-rate" class="convert-rate"></p>
               <p id="convert-status" class="view-status" hidden></p>
            </div>

            <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
         </section>

         <div id="side-panels" class="side-panels">
            <section class="panel work-panel" id="work-panel" aria-labelledby="work-heading">
               <h2 id="work-heading">Show your work</h2>
               <ol id="work-steps" class="work-steps"></ol>
            </section>

            <section class="panel history-panel" aria-labelledby="history-heading">
               <div class="panel-header">
                  <h2 id="history-heading">History</h2>
                  <button type="button" id="history-clear" class="text-button" hidden>Clear</button>
               </div>
               <ul id="history-list"></ul>
            </section>
         </div>
      </main>
   </div>

   <script src="js/parser.js"></script>
   <script src="js/graph.js"></script>
   <script src="js/converter.js"></script>
   <script src="js/app.js"></script>
</body>
</html>
